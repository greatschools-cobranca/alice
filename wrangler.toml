name = "torre-de-controle-api"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Crie o namespace com:
#   wrangler kv namespace create ROTINAS
# e cole o id gerado abaixo.
kv_namespaces = [
  { binding = "ROTINAS", id = "COLE_AQUI_O_ID_DO_KV" }
]

# Secrets (não vão neste arquivo — configure com `wrangler secret put NOME`):
#   JWT_SECRET
#   USERS_JSON
#   ROUTINE_WEBHOOK_URL   (opcional)
