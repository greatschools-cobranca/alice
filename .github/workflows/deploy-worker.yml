name: Deploy Torre de Controle Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: Set secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET_VALUE: ${{ secrets.JWT_SECRET }}
          USERS_JSON_VALUE: ${{ secrets.USERS_JSON }}
          ROUTINE_WEBHOOK_URL_VALUE: ${{ secrets.ROUTINE_WEBHOOK_URL }}
          ALICE_API_KEY_VALUE: ${{ secrets.ALICE_API_KEY }}
        run: |
          if [ -n "$JWT_SECRET_VALUE" ]; then
            printf '%s' "$JWT_SECRET_VALUE" | npx wrangler secret put JWT_SECRET
          fi
          if [ -n "$USERS_JSON_VALUE" ]; then
            printf '%s' "$USERS_JSON_VALUE" | npx wrangler secret put USERS_JSON
          fi
          if [ -n "$ROUTINE_WEBHOOK_URL_VALUE" ]; then
            printf '%s' "$ROUTINE_WEBHOOK_URL_VALUE" | npx wrangler secret put ROUTINE_WEBHOOK_URL
          fi
          if [ -n "$ALICE_API_KEY_VALUE" ]; then
            printf '%s' "$ALICE_API_KEY_VALUE" | npx wrangler secret put ALICE_API_KEY
          fi
