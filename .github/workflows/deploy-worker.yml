name: Deploy Torre de Controle Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      # Publica no Worker cada segredo que estiver cadastrado no GitHub (os vazios são ignorados).
      - name: Set secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          S_USERS_JSON: ${{ secrets.USERS_JSON }}
          S_ALICE_API_KEY: ${{ secrets.ALICE_API_KEY }}
          S_ROUTINE_WEBHOOK_URL: ${{ secrets.ROUTINE_WEBHOOK_URL }}
          S_OPENCLAW_BASE_URL: ${{ secrets.OPENCLAW_BASE_URL }}
          S_OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
          S_OPENCLAW_HOOKS_TOKEN: ${{ secrets.OPENCLAW_HOOKS_TOKEN }}
          S_CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          S_CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          S_MAIL_WEBHOOK_URL: ${{ secrets.MAIL_WEBHOOK_URL }}
          S_MAIL_WEBHOOK_SECRET: ${{ secrets.MAIL_WEBHOOK_SECRET }}
          S_AUDIT_EMAIL_TO: ${{ secrets.AUDIT_EMAIL_TO }}
        run: |
          for name in JWT_SECRET USERS_JSON ALICE_API_KEY ROUTINE_WEBHOOK_URL \
                      OPENCLAW_BASE_URL OPENCLAW_GATEWAY_TOKEN OPENCLAW_HOOKS_TOKEN \
                      CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET \
                      MAIL_WEBHOOK_URL MAIL_WEBHOOK_SECRET AUDIT_EMAIL_TO; do
            var="S_$name"
            value="${!var}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            fi
          done
